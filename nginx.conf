# Wisuno.me Nginx 配置
#
# 行为说明：
#   wisuno.me/任意路径        → 返回 index.html，前端 JS 测速后自动跳转到最优域名/相同路径
#   wisuno.me/gateway.html    → 返回 gateway.html，展示线路列表，用户手动选择（协商跳转）
#   wisuno.me/css|js|images/* → 静态资源直接返回
#
# 部署前请修改：
#   1. root 路径 → /usr/share/nginx/html/wisuno.me
#   2. server_name
#   3. SSL 证书路径（如启用 HTTPS）

server {
    listen 80;
    listen [::]:80;
    server_name wisuno.me www.wisuno.me;

    # 建议强制 HTTPS（证书就绪后取消注释）
    # return 301 https://$host$request_uri;
}

# return 301 https://test.wisunoportal.com$request_uri;
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wisuno.me www.wisuno.me;

    # 站点根目录（部署 wisuno.me 静态文件的目录）
    root /usr/share/nginx/html/wisuno.me;
    index index.html;

    # SSL 证书（按实际路径修改）
    ssl_certificate     /etc/nginx/ssl/wisuno.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wisuno.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 安全与缓存头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 客户端 IP 归属：同源代理，避免 ipapi.co 的 CORS/403 限制
    # 直连 nginx 时用 $remote_addr；若前面有 CDN/LB，须改读 X-Forwarded-For 等头
    resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
    resolver_timeout 5s;

    location = /api/geo {
        proxy_pass https://ipapi.co/$remote_addr/json/;
        proxy_ssl_server_name on;
        proxy_set_header Host ipapi.co;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 静态资源：直接返回，长期缓存
    location ~* ^/(css|js|images)/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 协商跳转入口：只展示线路列表，不自动跳转
    location = /gateway.html {
        root /usr/share/nginx/html/wisuno.me;
        try_files /gateway.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 可选：/gateway 别名，方便短链访问
    location = /gateway {
        root /usr/share/nginx/html/wisuno.me;
        try_files /gateway.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 根路径：自动跳转入口
    location = / {
        root /usr/share/nginx/html/wisuno.me;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 任意子路径：返回 index.html，保留 $uri 供 JS 拼接到目标域名
    # 例：wisuno.me/login?ref=1  → index.html → https://wisuno.biz/login?ref=1
    location / {
        # 排除真实存在的静态文件（如 favicon.ico）
        root /usr/share/nginx/html/wisuno.me;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/wisuno.me.access.log;
    error_log  /var/log/nginx/wisuno.me.error.log;
}
