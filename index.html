<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title en="Wisuno Global Access | Smart Route Selection"
         zh-cn="Wisuno Global Access | 智能线路选择">Wisuno Global Access | Smart Route Selection</title>
  <meta name="description"
        en="Wisuno smart route detection system, automatically selects the fastest site for you."
        zh-cn="Wisuno 智能线路检测系统，自动为您选择最快访问站点。"
        content="Wisuno smart route detection system, automatically selects the fastest site for you.">
  <meta name="theme-color" content="#0f172a">
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Icon -->
  <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
</head>

<body>
  <div class="container">
    <div class="glass-panel">
      <header>
        <img src="images/logo.png" alt="Wisuno" class="logo-img">
        <div class="subtitle" en="Global Smart Route Selection" zh-cn="全球智能线路选择">Global Smart Route Selection</div>
      </header>
      <div class="content">
        <div class="loader-container">
          <div class="spinner"></div>
          <div class="status-text" en="Selecting the optimal route for you..." zh-cn="正在为您选择最优线路...">Selecting the
            optimal route for you...</div>
        </div>
        <div class="domain-list">
          <!-- JS Injected Content -->
        </div>
        <!-- Error Module (Hidden by default) -->
        <div id="error-module" class="error-module">
          <div class="error-icon">⚠️</div>
          <h3 en="Network Connection Error" zh-cn="网络连接异常">Network Connection Error</h3>
          <p en="Unable to connect to any node. Please check your network settings."
             zh-cn="无法连接到任何节点，请检查您的网络设置。">Unable to connect to any node. Please check your network settings.</p>
          <button onclick="location.reload()" class="retry-btn" en="Retry Detection" zh-cn="重新检测">Retry
            Detection</button>
        </div>
      </div>
      <div class="footer">
        <div id="client-ip-info"
             style="margin-bottom: 0.8rem; font-size: 0.85rem; font-weight: 500; min-height: 1.2em;"></div>
        <p en="If redirect doesn't happen, please click a link above."
           zh-cn="如长时间未跳转，请手动点击上方列表。">If redirect doesn't happen, please click a link above.</p>
        <p style="margin-top:0.5rem;opacity:0.6;">&copy; Wisuno Technology Group</p>
      </div>
    </div>
  </div>
  <!-- Logic -->
  <script>
    // Enable Auto Redirect for this entry point
    window.WISUNO_CONFIG = { autoRedirect: true };
  </script>
  <script src="js/main.js"></script>
</body>

</html>
